# Base44 sandbox runbook for ANAHITA Fine Chocolates.
# Runs the Vite dev server from the cloned source (bind-mounted) so every edit is
# live immediately — never a prebuilt app image.
services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies install into the mounted source at startup, then the dev server
    # execs (so it stays PID 1 and receives signals).
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Bare pass-throughs supplied by the platform; the app only reads the domain
      # when BASE44_PREVIEW_MODE === "1" (see vite.config.js).
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      # Probes real dev-server responsiveness using node's built-in fetch.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  web_node_modules:
